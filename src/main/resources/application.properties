spring.application.name=Coffee-Bakery-Shop
server.port=9090


# Spring DATASOURCE (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/coffee_shop
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.boot.autoconfigure=ERROR

logging.level.org.springframework.security=DEBUG
debug=true


# Optional: Use HikariCP Connection Pool
spring.datasource.driver-class-name=org.postgresql.Driver

spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

app.jwt.secret=your-very-secure-secret-key-at-least-512-bits
jwt.expiration=86400 # 24 hours in seconds

# Set max file upload size to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

