<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content" lang="en">
<div class="card mb-4 mx-auto" style="max-width: 600px;" th:fragment="content">
  <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image">
  <div class="card-body">
    <h3 class="card-title" th:text="${product.name}"></h3>
    <p class="card-text" th:text="${product.description}"></p>
    <h4>$<span th:text="${product.price}"></span></h4>
    <form th:action="@{/cart/add}" method="post" class="mt-3">
      <input type="hidden" name="productId" th:value="${product.id}">
      <label>Quantity:</label>
      <input type="number" name="quantity" value="1" min="1" class="form-control mb-2" />
      <button type="submit" class="btn btn-success">Add to Cart</button>
    </form>
  </div>
</div>
</html>
