<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content" lang="en">
<div class="row" th:fragment="content">
    <div th:each="product : ${products}" class="col-md-4 mb-4">
        <div class="card h-100">
            <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image">
            <div class="card-body">
                <h5 class="card-title" th:text="${product.name}"></h5>
                <p class="card-text" th:text="${product.description}"></p>
                <p><strong>$<span th:text="${product.price}"></span></strong></p>
                <a class="btn btn-outline-primary"
                   th:href="@{/products/detail/{id}(id=${product.id})}">View Details</a>
                <form th:action="@{/cart/add}" method="post" class="mt-2">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="number" name="quantity" value="1" min="1" class="form-control mb-1" />
                    <button type="submit" class="btn btn-success btn-sm">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
