<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content" lang="en">
<div th:fragment="content">
    <h2 class="mb-4">Your Shopping Cart</h2>
    <div th:if="${cartItems.isEmpty()}">
        <p>Your cart is empty.</p>
    </div>
    <div th:if="${!cartItems.isEmpty()}">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.product.price}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" class="d-flex">
                        <input type="hidden" name="productId" th:value="${item.product.id}" />
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm me-2" />
                        <button type="submit" class="btn btn-sm btn-primary">Update</button>
                    </form>
                </td>
                <td th:text="${item.totalPrice}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="productId" th:value="${item.product.id}" />
                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <h4>Total: $<span th:text="${total}"></span></h4>
        <form th:action="@{/cart/clear}" method="post">
            <button type="submit" class="btn btn-warning">Clear Cart</button>
        </form>
    </div>
</div>
</html>
