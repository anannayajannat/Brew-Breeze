<div class="container" xmlns:th="http://www.w3.org/1999/xhtml">
    <h2 class="mb-4">Manage Orders</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Status</th>
            <th>Total Amount</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.customerName}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.totalAmount} + '৳'"></td>
            <td>
                <form th:action="@{/admin/orders/accept}" method="post" style="display:inline;">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <button class="btn btn-sm btn-primary" type="submit" th:if="${order.status == 'Pending'}">Accept</button>
                </form>

                <form th:action="@{/admin/orders/deliver}" method="post" style="display:inline;">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <button class="btn btn-sm btn-success" type="submit" th:if="${order.status == 'Accepted'}">Mark Delivered</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
