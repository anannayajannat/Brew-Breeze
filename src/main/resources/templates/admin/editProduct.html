<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${title}">Brew & Bite | Coffee Bakery Shop</title>
</head>
<body>
<h2 xmlns:th="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">Edit Product</h2>
<form th:action="@{/admin/inventory/edit/{id}(id=${product.id})}" method="post">
  <input type="text" name="name" class="form-control" th:value="${product.name}" required><br>
  <input type="text" name="description" class="form-control" th:value="${product.description}" required><br>
  <input type="number" name="price" class="form-control" th:value="${product.price}" required step="0.01"><br>
  <input type="text" name="imageUrl" class="form-control" th:value="${product.imageUrl}" required><br>
  <select name="category" class="form-control" required>
    <option value="COFFEE" th:selected="${product.category == 'COFFEE'}">Coffee</option>
    <option value="BAKERY" th:selected="${product.category == 'BAKERY'}">Bakery</option>
  </select><br>
  <button type="submit" class="btn btn-primary">Update Product</button>
</form>
</body>
</html>
