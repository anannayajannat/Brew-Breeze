<html lang="en" xmlns:th="http://www.thymeleaf.org">

<h2 xmlns:th="http://www.w3.org/1999/xhtml">Add New Product</h2>
<form th:action="@{/admin/inventory/add}" method="post">
  <input type="text" name="name" class="form-control" placeholder="Product Name" required><br>
  <input type="text" name="description" class="form-control" placeholder="Description" required><br>
  <input type="number" name="price" class="form-control" placeholder="Price" required step="0.01"><br>
  <input type="text" name="imageUrl" class="form-control" placeholder="Image URL" required><br>
  <select name="category" class="form-control" required>
    <option value="COFFEE">Coffee</option>
    <option value="BAKERY">Bakery</option>
  </select><br>
  <button type="submit" class="btn btn-success">Add Product</button>
</form>
