<!-- src/main/resources/templates/admin/orders.html -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Manage Orders</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>All Orders</h2>

  <table class="table table-bordered">
    <thead>
    <tr>
      <th>ID</th>
      <th>Customer</th>
      <th>Address</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="order : ${orders}">
      <td th:text="${order.id}"></td>
      <td th:text="${order.customerName}"></td>
      <td th:text="${order.address}"></td>
      <td th:text="${order.status}"></td>
      <td>
        <form th:action="@{/admin/accept/{id}(id=${order.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-success btn-sm">Accept</button>
        </form>
        <form th:action="@{/admin/deliver/{id}(id=${order.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-primary btn-sm">Mark Delivered</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
