<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Brew & Bite | Coffee Bakery Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Coffee Bakery Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>
                <th:block th:if="${session.user != null and session.user.role == 'ADMIN'}">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Admin Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/inventory">Inventory</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/orders">Orders</a></li>
                </th:block>
            </ul>
            <ul class="navbar-nav">
                <th:block th:if="${session.user == null}">
                    <li class="nav-item"><a class="nav-link" href="/auth/login">Login</a></li>
                </th:block>
                <th:block th:if="${session.user != null}">
                    <li class="nav-item"><a class="nav-link" href="/auth/logout">Logout</a></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:replace="${content}"></div>
</div>

<!-- Footer Section for Copyright -->
<footer class="text-center p-3 bg-light">
    <small>© 2025 Brew & Bite. All rights reserved.</small>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
